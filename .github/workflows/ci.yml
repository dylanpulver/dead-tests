name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pip install jsonschema
      - run: python -m unittest discover tests -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t deadtests .
      - run: docker run --rm -v "$PWD/cases/pyshadowed:/src" deadtests scan . 2>&1 | tee out.txt
      - run: grep -qF "test_area shadows line 8" out.txt

  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - id: all
        uses: ./
        with:
          path: cases
          changed-only: "false"
      - run: test "${{ steps.all.outputs.findings }}" -ge 60
      - id: strict
        uses: ./
        continue-on-error: true
        with:
          path: cases/pyshadowed
          checks: shadowed-tests
          changed-only: "false"
          fail-on-findings: "true"
      - run: test "${{ steps.strict.outcome }}" = failure && test "${{ steps.strict.outputs.findings }}" = 2
      # One small case only, so the Security tab carries 2 fixture alerts, not 60.
      - uses: ./
        with:
          path: cases/pyshadowed
          changed-only: "false"
          sarif-file: dead-tests.sarif
      - run: |
          grep -qF '"startLine": 12' dead-tests.sarif
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dead-tests.sarif
          category: dead-tests-fixtures

  # The annotations are what a PR author sees, so read them back from the API.
  action-annotations:
    needs: action
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          job=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" --jq '.jobs[] | select(.name == "action") | .id')
          gh api "repos/${{ github.repository }}/check-runs/$job/annotations" --jq '.[] | "\(.path):\(.start_line) \(.message)"' | tee annotations.txt
          grep -qF "cases/pyshadowed/tests/test_shapes.py:12 <module>.test_area shadows line 8" annotations.txt
