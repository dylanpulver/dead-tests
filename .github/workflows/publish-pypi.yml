name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "pyproject says $v, tag is ${{ github.event.release.tag_name }}"; exit 1; }
      - run: pip install build twine && python -m build && twine check dist/*
      - name: Installed wheel runs
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd cases && /tmp/v/bin/dead-tests scan pyshadowed | grep -qF "test_area shadows line 8"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
